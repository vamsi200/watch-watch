[package]
name = "watch-watch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.149"
clap = { version = "4.5.60", features = ["derive"] }
log = "0.4.30"
bpfx = {path = "/home/vamsi/scripts/bpfx/", features = ["serde"]}
futures = "0.3.34"
toml = "1.1.5"
directories = "6.0.0"
uuid = "1.26.0"
axum = "0.8.9"
axum-macros = "0.5.1"
rusqlite = { version = "0.40.2", features = ["chrono"] }
nanoid = "0.5.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
hex = "0.4.3"
base64 = "0.23.1"
